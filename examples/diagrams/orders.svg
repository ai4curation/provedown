<svg xmlns="http://www.w3.org/2000/svg" width="460" height="120" viewBox="0 0 460 120" font-family="sans-serif" font-size="14">
  <metadata>
    <code name="orders"><![CDATA[
import csv

with open("../data/orders.csv", newline="") as handle:
    orders = list(csv.DictReader(handle))

paid = [row for row in orders if row["status"] == "paid"]
paid_total = sum(float(row["amount"]) for row in paid)
]]></code>
  </metadata>
  <rect x="10" y="20" width="130" height="60" rx="8" fill="#eeeeee" stroke="#888888"/>
  <text x="75" y="45" text-anchor="middle">All orders</text>
  <text x="75" y="67" text-anchor="middle" font-weight="bold"><tspan class="result" data-code="len(orders)">6</tspan></text>
  <line x1="140" y1="50" x2="180" y2="50" stroke="#888888"/>
  <rect x="180" y="20" width="130" height="60" rx="8" fill="#d5e8d4" stroke="#82b366"/>
  <text x="245" y="45" text-anchor="middle">Paid</text>
  <text x="245" y="67" text-anchor="middle" font-weight="bold"><tspan class="result" data-code="len(paid)">4</tspan></text>
  <text x="330" y="55">Revenue <tspan class="result" data-code="f'${paid_total:.2f}'">$461.00</tspan></text>
</svg>
