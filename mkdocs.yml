site_name: Provedown
site_description: Markdown-native verifiable literate documents.
repo_url: https://github.com/ai4curation/provedown
repo_name: ai4curation/provedown

theme:
  name: material
  language: en
  icon:
    logo: material/check-decagram
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - content.code.select
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Tutorials:
      - First Verified Report: tutorials/first-verified-report.md
  - How-to Guides:
      - Verify a Document: how-to-guides/verify-a-document.md
      - Write Result Assertions: how-to-guides/write-result-assertions.md
      - Reuse Named Code: how-to-guides/reuse-named-code.md
      - Use Python Modules And Data Files: how-to-guides/use-python-modules-and-data-files.md
      - Verify Python With uv: how-to-guides/verify-python-with-uv.md
      - Use SQL And CSV Files: how-to-guides/use-sql-and-csv-files.md
      - Inspect Claim Dependencies: how-to-guides/inspect-claim-dependencies.md
      - Lint a Document: how-to-guides/lint-a-document.md
  - Reference:
      - CLI: reference/cli.md
      - Frontmatter: reference/frontmatter.md
      - Markup Contract: reference/markup.md
      - Python API: reference/python-api.md
      - Verifier Plugins: reference/verifier-plugins.md
  - Explanations:
      - Hallucination Detection: explanations/hallucination-detection.md
      - Dependency Metadata: explanations/dependency-metadata.md
      - Export Paths: explanations/export-paths.md
      - Why not marimo?: explanations/why-not-marimo.md
  - Examples:
      - Basic Verified Report: examples/basic-report.md
      - CSV Sales Summary: examples/data-file-report.md
      - SQL CSV Sales Summary: examples/sql-sales-summary.md
      - Pure HTML Report: examples/html-report.md
  - Design Notes:
      - Verifiable Literate Weave: ideas/verifiable-weave-spec.md
