name: Publish Python package

on:  # yamllint disable-line rule:truthy
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Build source and wheel distributions
        run: uv build

      - name: Verify built version matches release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          distributions=(dist/provedown-*.tar.gz)
          filename="${distributions[0]##*/}"
          version="${filename#provedown-}"
          version="${version%.tar.gz}"
          expected="${RELEASE_TAG#v}"
          echo "Built version: ${version}; release tag: ${RELEASE_TAG}"
          if [[ ${#distributions[@]} -ne 1 || "${version}" != "${expected}" ]]; then
            echo "::error::Built version does not match release tag"
            exit 1
          fi

      - name: Store distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/provedown
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
