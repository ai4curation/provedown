[project]
name = "provedown"
version = "0.1.0"
description = "Markdown-native verifiable literate documents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Provedown contributors" }
]
dependencies = [
  "PyYAML>=6.0.0",
]

[project.scripts]
provedown = "provedown.cli:main"

[dependency-groups]
dev = [
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.6.0",
  "mypy>=1.14.1",
  "pytest>=8.3.5",
  "ruff>=0.11.0",
  "types-PyYAML>=6.0.12.20250516",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provedown"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "RUF", "SIM", "UP"]
ignore = ["UP006", "UP007"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
files = ["src/provedown", "tests"]
