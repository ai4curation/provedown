[project]
name = "provedown"
dynamic = ["version"]
description = "Markdown-native verifiable literate documents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Provedown contributors" }
]
dependencies = [
  "duckdb>=1.0.0",
  "PyYAML>=6.0.0",
]

[project.scripts]
provedown = "provedown.cli:main"

[project.urls]
Documentation = "https://ai4curation.io/provedown/"
Issues = "https://github.com/ai4curation/provedown/issues"
Repository = "https://github.com/ai4curation/provedown"

[dependency-groups]
dev = [
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.6.0",
  "mypy>=1.14.1",
  "pytest>=8.3.5",
  "ruff>=0.11.0",
  "types-PyYAML>=6.0.12.20250516",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/provedown"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "RUF", "SIM", "UP"]
ignore = ["UP006", "UP007"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
files = ["src/provedown", "tests"]
